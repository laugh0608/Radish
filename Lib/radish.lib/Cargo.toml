[package]
name = "radish-lib"
version = "26.8.2"
edition = "2024"
authors = ["Radish Team"]
description = "Radish native extensions for high-performance image processing and file operations"
license = "Apache-2.0"

[dependencies]
# Image processing
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico"] }
ab_glyph = "=0.2.32"
png = "=0.18.1"
gif = "=0.14.2"
libwebp-sys = { version = "=0.14.4", default-features = false, features = ["std"] }
lcms2 = { version = "=6.2.0", features = ["static"] }
lcms2-sys = { version = "=4.0.7", default-features = false, features = ["static"] }
rustybuzz = "=0.20.1"
unicode-bidi = "=0.3.18"
unicode-segmentation = "=1.13.3"
ico = "=0.6.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# Benchmark / parallel
rayon = "1.11"

# Hashing
sha2 = "0.10"

# Error handling
anyhow = "1.0"

[dev-dependencies]

[lib]
name = "radish_lib"
crate-type = ["cdylib"]  # Compile as C-compatible dynamic library

[profile.release]
opt-level = 3             # Maximum optimization
lto = true                # Link-time optimization
codegen-units = 1         # Single code generation unit for better optimization
strip = true              # Strip symbols for smaller binary size
panic = "unwind"

# Host build scripts and proc macros retain metadata needed by rustc.
[profile.release.build-override]
strip = false
