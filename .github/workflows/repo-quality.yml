name: Repo Quality

on:
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check repository hygiene
        run: npm run check:repo-quality:candidate

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

  baseline-quick:
    name: Baseline Quick
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run quick baseline validation
        run: npm run validate:baseline:quick

  dependency-security:
    name: Dependency Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Restore .NET dependencies
        run: dotnet restore Radish.slnx --disable-parallel

      - name: Audit production dependencies
        run: npm run check:dependency-security

  backend-guard:
    name: Backend Guard
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RADISH_TEST_POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres;Pooling=false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Collect changed files
        run: node Scripts/collect-changed-files.mjs --base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}" --head="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}" --include-all-on-empty-base --write=changed-files.txt

      - name: Detect backend impact
        id: backend-impact
        shell: bash
        run: node Scripts/check-backend-impact.mjs --stdin-z --format=github-output < changed-files.txt >> "$GITHUB_OUTPUT"

      - name: Setup .NET SDK
        if: steps.backend-impact.outputs.impacted == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run backend API validation
        if: steps.backend-impact.outputs.impacted == 'true'
        run: npm run validate:backend

      - name: Skip backend guard when unaffected
        if: steps.backend-impact.outputs.impacted != 'true'
        shell: bash
        run: |
          echo "Backend Guard skipped: no backend/API-related files changed."

  identity-guard:
    name: Identity Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Collect changed files
        run: node Scripts/collect-changed-files.mjs --base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}" --head="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}" --include-all-on-empty-base --write=changed-files.txt

      - name: Detect identity impact
        id: identity-impact
        shell: bash
        run: node Scripts/check-identity-impact.mjs --stdin-z --format=github-output < changed-files.txt >> "$GITHUB_OUTPUT"

      - name: Setup .NET SDK
        if: steps.identity-impact.outputs.impacted == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        if: steps.identity-impact.outputs.impacted == 'true'
        run: npm ci

      - name: Run identity regression validation
        if: steps.identity-impact.outputs.impacted == 'true'
        run: npm run validate:identity

      - name: Skip identity guard when unaffected
        if: steps.identity-impact.outputs.impacted != 'true'
        shell: bash
        run: |
          echo "Identity Guard skipped: no identity-related files changed."

  candidate-quality:
    name: Candidate Quality
    runs-on: ubuntu-latest
    if: always()
    needs:
      - repo-hygiene
      - frontend-lint
      - baseline-quick
      - dependency-security
      - backend-guard
      - identity-guard
    steps:
      - name: Summarize PR quality gate
        shell: bash
        env:
          REPO_HYGIENE_RESULT: ${{ needs.repo-hygiene.result }}
          FRONTEND_LINT_RESULT: ${{ needs.frontend-lint.result }}
          BASELINE_QUICK_RESULT: ${{ needs.baseline-quick.result }}
          DEPENDENCY_SECURITY_RESULT: ${{ needs.dependency-security.result }}
          BACKEND_GUARD_RESULT: ${{ needs.backend-guard.result }}
          IDENTITY_GUARD_RESULT: ${{ needs.identity-guard.result }}
        run: |
          failed=false
          {
            echo "## PR Quality Gate"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          append_result() {
            local check_name="$1"
            local check_result="$2"
            echo "| ${check_name} | ${check_result} |" >> "$GITHUB_STEP_SUMMARY"
            if [[ "${check_result}" != "success" ]]; then
              failed=true
            fi
          }

          append_result "Repo Hygiene" "${REPO_HYGIENE_RESULT}"
          append_result "Frontend Lint" "${FRONTEND_LINT_RESULT}"
          append_result "Baseline Quick" "${BASELINE_QUICK_RESULT}"
          append_result "Dependency Security" "${DEPENDENCY_SECURITY_RESULT}"
          append_result "Backend Guard" "${BACKEND_GUARD_RESULT}"
          append_result "Identity Guard" "${IDENTITY_GUARD_RESULT}"

          if [[ "${failed}" == "true" ]]; then
            echo "One or more PR quality components did not succeed." >&2
            exit 1
          fi

          echo "All PR quality components succeeded."
