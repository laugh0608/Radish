name: 功能建议
description: 提议新的用户能力、流程改进或长期治理方向
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议。请先说明真实问题与使用场景，再描述方案；安全漏洞请按[安全策略](https://github.com/laugh0608/Radish/security/policy)私下报告。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前谁在什么场景下遇到了什么困难？为什么现有能力不足？
      placeholder: 作为……，当我……时，目前会……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的用户路径、核心行为和完成后的结果，不必预设具体实现。
      placeholder: 希望 Radish 能够……
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 范围与非目标
      description: 说明首批必须覆盖的范围，以及明确不需要同时解决的内容。
      placeholder: |
        必须覆盖：
        暂不包含：
    validations:
      required: true

  - type: dropdown
    id: surfaces
    attributes:
      label: 涉及产品面
      description: 可多选；无法判断时选择“需要项目评估”。
      multiple: true
      options:
        - 公开 Web
        - 私域 / 作者态 Web
        - Console 管理后台
        - Flutter Native
        - 后端 API / 数据模型
        - Auth / 权限 / 安全边界
        - 部署 / 运维 / 开发工具
        - 文档与协作治理
        - 需要项目评估
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 说明当前绕行方式、其他方案及其不足；没有时可填写“暂无”。
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充背景
      description: 可提供示意图、参考产品、关联 Issue 或专题文档；请确认第三方材料允许引用。
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue 和规划文档，未发现相同建议。
          required: true
        - label: 我已区分真实需求、建议方案和仍待验证的判断。
          required: true
        - label: 我同意遵守项目的[社区行为准则](https://github.com/laugh0608/Radish/blob/master/CODE_OF_CONDUCT.md)。
          required: true
